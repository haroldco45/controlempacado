<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vibras Positivas HM - Control de Arroz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --verde: #1b5e20; --azul: #0d47a1; --fondo: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--fondo); padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--verde); border-bottom: 4px solid var(--verde); padding-bottom: 10px; text-transform: uppercase; }
        .upload-box { background: #e8f5e9; border: 3px dashed var(--verde); padding: 30px; text-align: center; border-radius: 10px; cursor: pointer; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; }
        button { padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; font-size: 16px; transition: 0.3s; }
        .btn-inf { background: var(--azul); }
        .btn-wa { background: #25d366; }
        .resumen-panel { display: none; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; background: #fff9c4; padding: 20px; border-radius: 10px; border-left: 8px solid #fbc02d; margin-bottom: 25px; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th { background: var(--verde); color: white; padding: 12px; font-size: 13px; text-align: center; }
        td { padding: 10px; border: 1px solid #eee; text-align: center; font-size: 13px; }
        tr:nth-child(even) { background: #f9f9f9; }
        .footer { text-align: center; margin-top: 40px; color: #777; font-size: 12px; border-top: 1px solid #ddd; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>VIBRAS POSITIVAS HM</h1>
    
    <div class="upload-box" onclick="document.getElementById('excelInput').click()">
        <strong>📁 CLIC AQUÍ PARA CARGAR TU EXCEL</strong>
        <input type="file" id="excelInput" accept=".xlsx, .xls" style="display:none" />
    </div>

    <div class="btn-group">
        <button class="btn-inf" onclick="generarInforme()">📊 VER RESULTADOS</button>
        <button class="btn-wa" onclick="enviarWhatsApp()">📱 ENVIAR A GERENCIA</button>
    </div>

    <div id="panelInf" class="resumen-panel"></div>

    <div style="overflow-x:auto;">
        <table id="tablaArroz">
            <thead>
                <tr>
                    <th>MES</th>
                    <th>PRODUCTO</th>
                    <th>CANTIDAD</th>
                    <th>CIUDAD</th>
                    <th>PESO</th>
                    <th>TOTAL KILOS</th>
                    <th>VENDEDOR</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="7" style="color:#999; padding:30px;">Sube el archivo para procesar los datos.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        Desarrollado por <strong>Vibras Positivas HM</strong> &copy; 2026<br>
        Derechos de Autor (3117700431) - Caucasia, Antioquia
    </div>
</div>

<script>
    let datosCargados = [];

    document.getElementById('excelInput').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(evt) {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(ws, { defval: "" });
            
            if(json.length > 0) {
                procesar(json);
                alert("✅ ÉXITO: Se procesaron " + json.length + " filas correctamente.");
            }
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function procesar(filas) {
        datosCargados = filas.map(f => {
            const find = (keys) => {
                const realKey = Object.keys(f).find(k => 
                    keys.some(key => k.toUpperCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(key))
                );
                return f[realKey];
            };

            const c = parseFloat(find(['CANTIDAD', 'CANT'])) || 0;
            const p = parseFloat(find(['PESO'])) || 0;

            return {
                mes: find(['MES']) || '-',
                prod: find(['PRODUCTO', 'NOMBRE', 'ARTICULO']) || '-',
                cant: c,
                ciu: find(['CIUDAD', 'MUNICIPIO']) || '-',
                peso: p,
                kg: c * p,
                vend: find(['VENDEDOR', 'VEND']) || 'N/A'
            };
        });
        actualizarVista();
    }

    function actualizarVista() {
        const body = document.querySelector("#tablaArroz tbody");
        body.innerHTML = "";
        datosCargados.forEach(v => {
            body.innerHTML += `<tr>
                <td>${v.mes}</td>
                <td>${v.prod}</td>
                <td>${v.cant}</td>
                <td>${v.ciu}</td>
                <td>${v.peso}</td>
                <td><strong>${v.kg.toLocaleString()} Kg</strong></td>
                <td>${v.vend}</td>
            </tr>`;
        });
    }

    function generarInforme() {
        if(datosCargados.length === 0) return;
        
        let vMap = {}, pMap = {}, cMap = {};
        datosCargados.forEach(v => {
            vMap[v.vend] = (vMap[v.vend] || 0) + v.kg;
            pMap[v.prod] = (pMap[v.prod] || 0) + v.kg;
            cMap[v.ciu] = (cMap[v.ciu] || 0) + v.kg;
        });

        const topV = Object.keys(vMap).reduce((a, b) => vMap[a] > vMap[b] ? a : b);
        const topP = Object.keys(pMap).reduce((a, b) => pMap[a] > pMap[b] ? a : b);
        const topC = Object.keys(cMap).reduce((a, b) => cMap[a] > cMap[b] ? a : b);

        const res = document.getElementById('panelInf');
        res.style.display = "grid";
        res.innerHTML = `
            <div><strong>🏆 TOP VENDEDOR:</strong><br>${topV} (${vMap[topV].toLocaleString()} Kg)</div>
            <div><strong>📦 PRODUCTO LÍDER:</strong><br>${topP}</div>
            <div><strong>📍 CIUDAD PRINCIPAL:</strong><br>${topC}</div>
        `;
    }

    function enviarWhatsApp() {
        if(datosCargados.length === 0) return;
        const totalKg = datosCargados.reduce((s, v) => s + v.kg, 0);
        const txt = `VIBRAS POSITIVAS HM\nInforme de Ventas\nTotal: ${totalKg.toLocaleString()} Kg\nRegistros: ${datosCargados.length}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
    }
</script>

</body>
</html>
