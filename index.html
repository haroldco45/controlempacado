<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Arroz - Vibras Positivas HM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #2e7d32; --secondary: #1565c0; --accent: #fbc02d; --light: #f4f4f9; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--light); padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); }
        .upload-section { border: 2px dashed var(--primary); padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 25px; background: #f1f8e9; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        button { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
        .btn-report { background: var(--secondary); }
        .btn-wa { background: #25d366; }
        .stats-panel { display: none; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin: 20px 0; background: #fff9c4; padding: 20px; border-radius: 8px; border-left: 5px solid var(--accent); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: var(--primary); color: white; padding: 12px; border: 1px solid #ddd; }
        td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        tr:nth-child(even) { background: #f9f9f9; }
        .footer { margin-top: 40px; text-align: center; font-size: 0.85em; color: #555; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Vibras Positivas HM - Control de Arroz</h1>

    <div class="upload-section">
        <p>Suba su archivo Excel (.xlsx) con los datos de venta</p>
        <input type="file" id="excelInput" accept=".xlsx, .xls" />
    </div>

    <div class="actions">
        <button class="btn-report" onclick="generarInforme()">📊 Generar Informes</button>
        <button class="btn-wa" onclick="enviarWhatsApp()">📱 Enviar a Gerencia</button>
    </div>

    <div id="informe" class="stats-panel">
        <div><strong>🏆 Top Vendedor:</strong> <br><span id="topVendedor">-</span></div>
        <div><strong>🌾 Producto Líder:</strong> <br><span id="topProd">-</span></div>
        <div><strong>📍 Ciudad Principal:</strong> <br><span id="topCiudad">-</span></div>
    </div>

    <div style="overflow-x:auto;">
        <table id="tablaVentas">
            <thead>
                <tr>
                    <th>Mes</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Ciudad</th>
                    <th>Peso</th>
                    <th>Total Kilos</th>
                    <th>Vendedor</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="footer">
        <p>App desarrollada por <strong>Vibras Positivas HM</strong> &copy; 2026<br>
        Derechos de Autor (3117700431)</p>
    </div>
</div>

<script>
    let ventas = [];

    document.getElementById('excelInput').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(sheet);
                
                if(jsonData.length === 0) {
                    alert("El archivo está vacío");
                    return;
                }
                procesarDatos(jsonData);
                alert("¡Archivo cargado con éxito! " + jsonData.length + " filas encontradas.");
            } catch (err) {
                alert("Error al leer el archivo. Asegúrate de que sea un Excel válido.");
            }
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function procesarDatos(datos) {
        ventas = datos.map(f => {
            // Buscador flexible de columnas (ignora espacios y tildes)
            const encontrar = (listaPalabras) => {
                const clave = Object.keys(f).find(k => 
                    listaPalabras.some(p => k.toLowerCase().trim().includes(p.toLowerCase()))
                );
                return f[clave] || "";
            };

            const cant = parseFloat(encontrar(['cantidad', 'cant']));
            const peso = parseFloat(encontrar(['peso', 'pes']));
            
            return {
                mes: encontrar(['mes']),
                producto: encontrar(['producto', 'nombre']),
                cantidad: isNaN(cant) ? 0 : cant,
                ciudad: encontrar(['ciudad']),
                peso: isNaN(peso) ? 0 : peso,
                kilos: (isNaN(cant) || isNaN(peso)) ? 0 : cant * peso,
                vendedor: encontrar(['vendedor', 'vend'])
            };
        });
        renderizar();
    }

    function renderizar() {
        const tbody = document.querySelector("#tablaVentas tbody");
        tbody.innerHTML = "";
        ventas.forEach(v => {
            const row = `<tr>
                <td>${v.mes}</td>
                <td>${v.producto}</td>
                <td>${v.cantidad}</td>
                <td>${v.ciudad}</td>
                <td>${v.peso}</td>
                <td>${v.kilos.toFixed(2)}</td>
                <td>${v.vendedor}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function generarInforme() {
        if(ventas.length === 0) return alert("Suba un archivo primero");
        
        let v_map = {}, p_map = {}, c_map = {};

        ventas.forEach(v => {
            v_map[v.vendedor] = (v_map[v.vendedor] || 0) + v.kilos;
            c_map[v.ciudad] = (c_map[v.ciudad] || 0) + v.kilos;
            p_map[v.producto] = (p_map[v.producto] || 0) + v.kilos;
        });

        const mejorV = Object.keys(v_map).reduce((a,b) => v_map[a] > v_map[b] ? a : b);
        const mejorP = Object.keys(p_map).reduce((a,b) => p_map[a] > p_map[b] ? a : b);
        const mejorC = Object.keys(c_map).reduce((a,b) => c_map[a] > c_map[b] ? a : b);

        document.getElementById('informe').style.display = 'grid';
        document.getElementById('topVendedor').innerText = `${mejorV} (${v_map[mejorV].toFixed(1)} Kg)`;
        document.getElementById('topProd').innerText = mejorP;
        document.getElementById('topCiudad').innerText = mejorC;
    }

    function enviarWhatsApp() {
        if(ventas.length === 0) return;
        const total = ventas.reduce((acc, v) => acc + v.kilos, 0);
        const texto = `Reporte Vibras Positivas HM\nTotal Kilos: ${total.toFixed(2)}\nTop Vendedor: ${document.getElementById('topVendedor').innerText}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
    }
</script>
</body>
</html>
