<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GESTIÓN DE LA EMPACADORA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --v: #1b5e20; --a: #0d47a1; --f: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--f); margin: 0; padding: 20px; }
        .card { max-width: 1200px; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-top: 10px solid var(--v); }
        h1 { text-align: center; color: var(--v); margin-bottom: 20px; text-transform: uppercase; }
        
        .filter-group { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
            background: #e8f5e9; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px;
            border: 1px solid #c8e6c9;
        }
        .filter-box label { font-weight: bold; display: block; margin-bottom: 8px; color: var(--v); font-size: 13px; }
        .filter-box p { font-size: 11px; color: #666; margin: 0 0 5px 0; }
        
        select[multiple] { 
            width: 100%; 
            height: 100px; 
            border-radius: 8px; 
            border: 1px solid #a5d6a7; 
            padding: 5px;
            font-size: 13px;
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; }
        button { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: #fff; transition: 0.3s; }
        .btn-wa { background: #25d366; }

        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .summary-card { background: #fffde7; padding: 20px; border-radius: 10px; border-left: 8px solid #fbc02d; }
        .summary-card h3 { margin-top: 0; color: #5d4037; font-size: 16px; border-bottom: 1px solid #ffe082; padding-bottom: 5px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th { background: var(--v); color: #fff; padding: 10px; text-align: center; }
        td { padding: 8px; border: 1px solid #eee; text-align: center; }
        .total-row { background: #f1f8e9; font-weight: bold; color: var(--v); }

        .footer { text-align: center; margin-top: 40px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>GESTIÓN DE LA EMPACADORA</h1>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <input type="file" id="excelInput" accept=".xlsx, .xls" />
    </div>

    <div class="filter-group" id="filterArea" style="display:none">
        <div class="filter-box">
            <label>MESES (Ctrl + clic)</label>
            <select id="selMes" multiple onchange="aplicarTodo()"></select>
        </div>
        <div class="filter-box">
            <label>PRODUCTOS (Ctrl + clic)</label>
            <select id="selProd" multiple onchange="aplicarTodo()"></select>
        </div>
        <div class="filter-box">
            <label>VENDEDORES (Ctrl + clic)</label>
            <select id="selVend" multiple onchange="aplicarTodo()"></select>
        </div>
    </div>

    <div class="summary-grid" id="summaryArea" style="display:none">
        <div class="summary-card">
            <h3>TOTALES POR PRODUCTO (Kg)</h3>
            <table id="tablaResumenProd">
                <thead><tr><th>Producto</th><th>Total Kg</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="summary-card">
            <h3>RESUMEN GENERAL SELECCIONADO</h3>
            <p><strong>Registros:</strong> <span id="resRegistros">0</span></p>
            <p><strong>Total Kilos:</strong> <span id="resKilos">0</span> Kg</p>
            <p><strong>Líder Ventas:</strong> <span id="resLider">-</span></p>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-wa" onclick="enviarWhatsApp()">📱 ENVIAR REPORTE COMPLETO A GERENCIA</button>
    </div>

    <div style="overflow-x:auto; max-height: 400px; border: 1px solid #eee; border-radius: 8px;">
        <table id="tablaPrincipal">
            <thead>
                <tr>
                    <th>MES</th>
                    <th>PRODUCTO</th>
                    <th>CANTIDAD</th>
                    <th>PESO</th>
                    <th>TOTAL KG</th>
                    <th>VENDEDOR</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="footer">
        App desarrollada por <strong>Vibras Positivas HM</strong> &copy; 2026<br>
        Derechos de Autor Reservados - Cel: 3117700431
    </div>
</div>

<script>
    let rawData = [];
    let filteredData = [];
    let prodTotals = {};

    document.getElementById('excelInput').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = (evt) => {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ""});
            if (json.length > 0) procesar(json);
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function procesar(matriz) {
        let idx = matriz.findIndex(f => f.some(c => c && c.toString().toUpperCase().includes("PRODUCTO")));
        if (idx === -1) idx = 0;
        const heads = matriz[idx].map(t => t.toString().toUpperCase().trim());
        const body = matriz.slice(idx + 1);

        const getC = (n, f) => {
            const i = heads.findIndex(h => h.normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(n));
            return i !== -1 ? f[i] : "";
        };

        rawData = body.filter(f => f.length > 0 && getC("PRODUCTO", f)).map(f => {
            const c = parseFloat(getC("CANTIDAD", f)) || 0;
            const p = parseFloat(getC("PESO", f)) || 0;
            return {
                mes: getC("MES", f).toString().trim() || "S/M",
                prod: getC("PRODUCTO", f).toString().trim() || "S/P",
                cant: c,
                peso: p,
                kg: c * p,
                vend: getC("VENDEDOR", f).toString().trim() || "S/V"
            };
        });

        filteredData = [...rawData];
        poblarListas();
        aplicarTodo();
        document.getElementById('filterArea').style.display = 'grid';
        document.getElementById('summaryArea').style.display = 'grid';
    }

    function poblarListas() {
        const setOptions = (id, campo) => {
            const select = document.getElementById(id);
            const unicos = [...new Set(rawData.map(d => d[campo]))].sort();
            select.innerHTML = unicos.map(u => `<option value="${u}" selected>${u}</option>`).join('');
        };
        setOptions('selMes', 'mes');
        setOptions('selProd', 'prod');
        setOptions('selVend', 'vend');
    }

    function aplicarTodo() {
        const getSelected = (id) => Array.from(document.getElementById(id).selectedOptions).map(o => o.value);
        const selMes = getSelected('selMes');
        const selProd = getSelected('selProd');
        const selVend = getSelected('selVend');

        filteredData = rawData.filter(r => 
            selMes.includes(r.mes) && 
            selProd.includes(r.prod) && 
            selVend.includes(r.vend)
        );

        renderTablas();
    }

    function renderTablas() {
        const tbody = document.querySelector("#tablaPrincipal tbody");
        tbody.innerHTML = filteredData.map(r => `
            <tr>
                <td>${r.mes}</td>
                <td>${r.prod}</td>
                <td>${r.cant}</td>
                <td>${r.peso}</td>
                <td>${r.kg.toLocaleString()}</td>
                <td>${r.vend}</td>
            </tr>
        `).join('');

        prodTotals = {};
        let totalGeneral = 0;
        let vends = {};

        filteredData.forEach(r => {
            prodTotals[r.prod] = (prodTotals[r.prod] || 0) + r.kg;
            totalGeneral += r.kg;
            vends[r.vend] = (vends[r.vend] || 0) + r.kg;
        });

        const resProdBody = document.querySelector("#tablaResumenProd tbody");
        resProdBody.innerHTML = Object.keys(prodTotals).sort().map(p => `
            <tr><td>${p}</td><td>${prodTotals[p].toLocaleString()}</td></tr>
        `).join('') + `<tr class="total-row"><td>TOTAL SELECCIONADO</td><td>${totalGeneral.toLocaleString()}</td></tr>`;

        document.getElementById('resRegistros').innerText = filteredData.length;
        document.getElementById('resKilos').innerText = totalGeneral.toLocaleString();
        
        const lider = Object.keys(vends).length ? Object.keys(vends).reduce((a, b) => vends[a] > vends[b] ? a : b) : "-";
        document.getElementById('resLider').innerText = lider;
    }

    function enviarWhatsApp() {
        if (!filteredData.length) return;
        
        const total = filteredData.reduce((s, r) => s + r.kg, 0);
        const lider = document.getElementById('resLider').innerText;
        
        // Construcción del reporte de productos
        let reporteProductos = "";
        Object.keys(prodTotals).sort().forEach(p => {
            reporteProductos += `- ${p}: ${prodTotals[p].toLocaleString()} Kg\n`;
        });

        const mensaje = `*REPORTE DE GESTIÓN DE LA EMPACADORA*\n\n` +
                        `*RESUMEN GENERAL*\n` +
                        `• Registros procesados: ${filteredData.length}\n` +
                        `• Total Kilos: ${total.toLocaleString()} Kg\n` +
                        `• Líder de Ventas: ${lider}\n\n` +
                        `*DETALLE POR PRODUCTO*\n` +
                        reporteProductos +
                        `\n_Reporte generado automáticamente._`;

        window.open(`https://wa.me/?text=${encodeURIComponent(mensaje)}`, '_blank');
    }
</script>

</body>
</html>
