<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VIBRAS POSITIVAS HM - CONTROL TOTAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --v: #1b5e20; --a: #0d47a1; --f: #f0f2f5; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--f); margin: 0; padding: 20px; }
        .card { max-width: 1100px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--v); border-bottom: 3px solid var(--v); padding-bottom: 10px; margin: 0 0 20px 0; }
        .drop-zone { background: #e8f5e9; border: 3px dashed var(--v); padding: 30px; text-align: center; border-radius: 10px; cursor: pointer; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #fff; transition: 0.3s; }
        .btn-inf { background: var(--a); }
        .btn-wa { background: #25d366; }
        .info-panel { display: none; background: #fff9c4; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 6px solid #fbc02d; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { background: var(--v); color: #fff; padding: 12px; border: 1px solid #ddd; }
        td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        tr:nth-child(even) { background: #f9f9f9; }
        .footer { text-align: center; margin-top: 30px; font-size: 11px; color: #666; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>VIBRAS POSITIVAS HM</h1>
    
    <div class="drop-zone" onclick="document.getElementById('excelFile').click()">
        <strong>📥 CLIC AQUÍ PARA SUBIR EL EXCEL</strong>
        <input type="file" id="excelFile" accept=".xlsx, .xls" style="display:none">
    </div>

    <div class="btn-group">
        <button class="btn-inf" onclick="analizarDatos()">📊 GENERAR INFORME</button>
        <button class="btn-wa" onclick="enviarWhatsApp()">📱 ENVIAR A GERENCIA</button>
    </div>

    <div id="resumen" class="info-panel" style="display:none"></div>

    <div style="overflow-x:auto;">
        <table id="tablaVentas">
            <thead>
                <tr>
                    <th>MES</th>
                    <th>PRODUCTO</th>
                    <th>CANTIDAD</th>
                    <th>CIUDAD</th>
                    <th>PESO</th>
                    <th>TOTAL KILOS</th>
                    <th>VENDEDOR</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="7">No hay datos cargados.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        Desarrollado por <strong>Vibras Positivas HM</strong> &copy; 2026 - Derechos de Autor (3117700431)
    </div>
</div>

<script>
    let registros = [];

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = (evt) => {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const hoja = workbook.Sheets[workbook.SheetNames[0]];
            // Convertimos a matriz de datos para búsqueda manual
            const filas = XLSX.utils.sheet_to_json(hoja, {header: 1, defval: ""});
            
            if (filas.length > 0) {
                extraerInformacion(filas);
            }
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function extraerInformacion(matriz) {
        // Buscamos en qué fila están los títulos
        let indiceTitulos = matriz.findIndex(fila => 
            fila.some(celda => celda && celda.toString().toUpperCase().includes("PRODUCTO") || celda.toString().toUpperCase().includes("CANTIDAD"))
        );

        if (indiceTitulos === -1) indiceTitulos = 0; // Por defecto fila 0

        const titulos = matriz[indiceTitulos].map(t => t.toString().toUpperCase().trim());
        const datos = matriz.slice(indiceTitulos + 1);

        const col = (nombre, filaActual) => {
            const idx = titulos.findIndex(t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(nombre));
            return idx !== -1 ? filaActual[idx] : "";
        };

        registros = datos.filter(f => f.length > 0 && col("PRODUCTO", f)).map(f => {
            const c = parseFloat(col("CANTIDAD", f)) || 0;
            const p = parseFloat(col("PESO", f)) || 0;
            return {
                mes: col("MES", f) || "-",
                prod: col("PRODUCTO", f) || "-",
                cant: c,
                ciu: col("CIUDAD", f) || "-",
                peso: p,
                kg: c * p,
                vend: col("VENDEDOR", f) || "N/A"
            };
        });

        mostrarTabla();
        alert("✅ Procesados " + registros.length + " registros de Vibras Positivas HM.");
    }

    function mostrarTabla() {
        const body = document.querySelector("#tablaVentas tbody");
        body.innerHTML = registros.map(r => `
            <tr>
                <td>${r.mes}</td>
                <td>${r.prod}</td>
                <td>${r.cant}</td>
                <td>${r.ciu}</td>
                <td>${r.peso}</td>
                <td><strong>${r.kg.toLocaleString()} Kg</strong></td>
                <td>${r.vend}</td>
            </tr>
        `).join('');
    }

    function analizarDatos() {
        if (registros.length === 0) return alert("Sube el archivo primero.");
        
        let vends = {}, prods = {}, ciuds = {};
        registros.forEach(r => {
            vends[r.vend] = (vends[r.vend] || 0) + r.kg;
            prods[r.prod] = (prods[r.prod] || 0) + r.kg;
            ciuds[r.ciu] = (ciuds[r.ciu] || 0) + r.kg;
        });

        const top = (obj) => Object.keys(obj).reduce((a, b) => obj[a] > obj[b] ? a : b);

        const panel = document.getElementById('resumen');
        panel.style.display = "grid";
        panel.innerHTML = `
            <div><strong>🏆 VENDEDOR TOP:</strong><br>${top(vends)} (${vends[top(vends)].toLocaleString()} Kg)</div>
            <div><strong>📦 PRODUCTO LÍDER:</strong><br>${top(prods)}</div>
            <div><strong>📍 CIUDAD LÍDER:</strong><br>${top(ciuds)}</div>
        `;
    }

    function enviarWhatsApp() {
        if (registros.length === 0) return;
        const total = registros.reduce((s, r) => s + r.kg, 0);
        const msg = encodeURIComponent(`REPORTE VIBRAS POSITIVAS HM:\nTotal Kilos: ${total.toLocaleString()} Kg\nRegistros: ${registros.length}`);
        window.open(`https://wa.me/?text=${msg}`, '_blank');
    }
</script>

</body>
</html>
